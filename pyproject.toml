[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-positioning-runner"
version = "0.1.0"
description = "A resume-safe multi-provider runner for LLM positioning benchmarks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Taher Haghverdi" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
llm-positioning = "llm_runner.cli:main"

[tool.setuptools]
packages = ["llm_runner"]
