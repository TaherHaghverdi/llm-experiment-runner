[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-experiment-runner"
version = "0.2.0"
description = "A resume-safe runner for repeatable multi-provider LLM experiments"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Taher Haghverdi" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
llm-experiment = "llm_runner.cli:main"

[tool.setuptools]
packages = ["llm_runner"]
